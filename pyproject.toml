[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avantis-paper-bot"
version = "0.0.1"
description = "Paper-first Avantis perps bot scaffold: feed->candles->journal->snapshot"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Boilermolt"}]
dependencies = [
  "avantis-trader-sdk>=0.1.0",
  "httpx>=0.27.0",
]

[project.scripts]
apb-feed = "bot.feed_listener:main"
apb-cycle = "bot.run_cycle:main"
apb-replay = "bot.replay:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
